[project]
name = "zi"
version = "0.1.0"
description = "rime-wubi Zi 字表构建：国标 8,105 单字三档 + 表外增广"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pyright==1.1.414",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
